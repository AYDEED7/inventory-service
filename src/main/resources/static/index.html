<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16202B;
    --ground: #E8ECEF;
    --surface: #FFFFFF;
    --line: #C5CED6;
    --muted: #52606D;
    --yellow: #F5C400;
    --green: #1C7C54;
    --amber: #8A5A00;
    --red: #B42318;
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
  }

  .page { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }

  .top { border-bottom: 6px solid var(--yellow); padding-bottom: 20px; }
  .top h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2.8rem, 8vw, 4.6rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
  }
  .lede { max-width: 46ch; margin: 12px 0 0; color: var(--muted); font-size: 1.1rem; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 32px;
    margin-top: 28px;
    align-items: start;
  }

  /* Search */
  .search { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search input[type="search"] { flex: 1 1 220px; }
  .search input[type="number"] { width: 130px; }
  .search label { display: flex; align-items: center; gap: 6px; color: var(--muted); }

  input[type="search"], input[type="number"] {
    padding: 11px 12px;
    border: 1px solid #9AA7B3;
    border-radius: 4px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
  }

  button {
    padding: 10px 16px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--ink);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--ink); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  :focus-visible { outline: 3px solid #1F5FBF; outline-offset: 2px; }

  #message { min-height: 1.6em; margin: 14px 0; font-weight: 600; }
  #message.error { color: var(--red); }
  #message.ok { color: var(--green); }

  /* Product shelf */
  .list { display: grid; gap: 10px; }
  .empty { color: var(--muted); margin: 0; }

  .row {
    display: grid;
    grid-template-columns: 112px minmax(0, 1fr) auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .tag {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 8px;
    background: var(--yellow);
    font-family: var(--display);
    font-weight: 700;
    font-size: 2.3rem;
    line-height: 1;
  }
  .info { padding: 14px 16px; }
  .info h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.6rem; line-height: 1.15; }
  .info p { margin: 4px 0 0; color: var(--muted); }

  .buy {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    padding: 14px 16px;
  }
  .stock { margin: 0; font-weight: 600; font-size: 0.95rem; }
  .stock::before {
    content: "";
    display: inline-block;
    width: 0.6em;
    height: 0.6em;
    margin-right: 0.45em;
    border-radius: 50%;
    background: currentColor;
  }
  .stock.plenty { color: var(--green); }
  .stock.low { color: var(--amber); }
  .stock.none { color: var(--red); }
  .controls { display: flex; gap: 8px; }
  .controls input[type="number"] { width: 64px; }

  /* Holds */
  .holds h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 700; font-size: 1.9rem; }
  .holds-note { margin: 0 0 14px; color: var(--muted); font-size: 0.95rem; }
  #holdsEmpty { color: var(--muted); margin: 0; }

  .hold {
    margin-bottom: 10px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left-width: 6px;
    border-radius: 4px;
  }
  .hold.pending { border-left-color: var(--yellow); }
  .hold.paid { border-left-color: var(--green); }
  .hold.cancelled { border-left-color: #7B8794; }
  .hold.expired { border-left-color: var(--red); }

  .hold-title { margin: 0; font-weight: 600; }
  .hold-state { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
  .hold-id { margin: 0; color: var(--muted); font-size: 0.85rem; }

  .meter { height: 8px; margin-top: 10px; overflow: hidden; border-radius: 4px; background: #DDE3E8; }
  .fill { width: 100%; height: 100%; background: var(--ink); transition: width 1s linear; }
  .fill.urgent { background: var(--red); }
  .time { margin: 6px 0 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; }

  .clear { margin-top: 4px; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }
  @media (min-width: 861px) {
    .holds { position: sticky; top: 16px; }
  }
  @media (max-width: 560px) {
    .row { grid-template-columns: 88px minmax(0, 1fr); }
    .buy {
      grid-column: 1 / -1;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <h1>Stockroom</h1>
    <p class="lede">Reserve an item and it's held for you. Pay before the timer runs out, or it goes back on the shelf.</p>
  </header>

  <div class="layout">
    <main>
      <form class="search" onsubmit="search(event)">
        <input id="q" type="search" placeholder="Search products" aria-label="Search products">
        <input id="maxPrice" type="number" min="0" step="any" placeholder="Max price" aria-label="Maximum price">
        <label><input id="inStock" type="checkbox"> In stock only</label>
        <button type="submit">Search</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
      <div id="products" class="list"></div>
    </main>

    <aside class="holds">
      <h2>Your holds</h2>
      <p class="holds-note">Held items return to the shelf when the timer ends.</p>
      <p id="holdsEmpty">Nothing reserved yet. Reserve an item and it will appear here with a countdown.</p>
      <div id="orders"></div>
      <button type="button" class="secondary clear" onclick="clearFinished()">Clear finished</button>
    </aside>
  </div>

</div>

<script>
const STORAGE_KEY = "stockroom-holds";
const holds = [];

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) {
    node.className = className;
  }
  if (text !== undefined) {
    node.textContent = text;
  }
  return node;
}

function showMessage(text, isError) {
  const box = document.getElementById("message");
  box.textContent = text;
  box.className = isError ? "error" : "ok";
}

async function request(url, options) {
  const response = await fetch(url, options);
  const text = await response.text();
  let data = null;
  if (text !== "") {
    data = JSON.parse(text);
  }
  if (!response.ok) {
    let message = "Something went wrong (error " + response.status + ").";
    if (data !== null && data.message) {
      message = data.message;
    }
    throw new Error(message);
  }
  return data;
}

/* ---------- Products ---------- */

async function search(event) {
  if (event) {
    event.preventDefault();
  }
  const q = document.getElementById("q").value.trim();
  const maxPrice = document.getElementById("maxPrice").value;
  const inStock = document.getElementById("inStock").checked;
  let url = "/products";
  if (q !== "") {
    url = "/products/search?q=" + encodeURIComponent(q);
    if (maxPrice !== "") {
      url = url + "&maxPrice=" + maxPrice;
    }
    if (inStock) {
      url = url + "&inStock=true";
    }
  }
  try {
    renderProducts(await request(url));
  } catch (e) {
    showMessage(e.message, true);
  }
}

function stockInfo(stock) {
  if (stock === 0) {
    return { text: "Sold out", cls: "none" };
  }
  if (stock < 5) {
    return { text: "Only " + stock + " left", cls: "low" };
  }
  return { text: stock + " in stock", cls: "plenty" };
}

function renderProducts(list) {
  const box = document.getElementById("products");
  box.innerHTML = "";
  if (list.length === 0) {
    box.appendChild(el("p", "empty", "Nothing matches that search. Try a shorter word or clear the price limit."));
    return;
  }
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const info = stockInfo(p.stock);

    const row = el("div", "row");
    row.appendChild(el("div", "tag", Number(p.price).toFixed(2)));

    const details = el("div", "info");
    details.appendChild(el("h3", "", p.name));
    details.appendChild(el("p", "", p.description || ""));
    row.appendChild(details);

    const buy = el("div", "buy");
    buy.appendChild(el("p", "stock " + info.cls, info.text));

    const controls = el("div", "controls");
    const quantity = el("input");
    quantity.type = "number";
    quantity.min = 1;
    quantity.max = p.stock;
    quantity.value = 1;
    quantity.setAttribute("aria-label", "Quantity of " + p.name);
    const button = el("button", "", "Reserve");
    button.disabled = p.stock === 0;
    button.onclick = function () {
      reserve(p, quantity.value);
    };
    controls.appendChild(quantity);
    controls.appendChild(button);
    buy.appendChild(controls);
    row.appendChild(buy);

    box.appendChild(row);
  }
}

async function reserve(product, quantityText) {
  const quantity = Number(quantityText);
  if (!Number.isInteger(quantity) || quantity < 1) {
    showMessage("Enter a quantity of 1 or more.", true);
    return;
  }
  try {
    const order = await request("/orders", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ productId: product.id, quantity: quantity })
    });
    order.name = product.name;
    order.lastCheck = 0;
    holds.push(order);
    saveHolds();
    renderHolds();
    const minutes = Math.round((new Date(order.expiresAt) - new Date(order.createdAt)) / 60000);
    showMessage("Reserved " + quantity + " x " + product.name + ". Held for " + minutes + " minutes.", false);
    search();
  } catch (e) {
    showMessage(e.message, true);
  }
}

/* ---------- Holds ---------- */

function saveHolds() {
  try {
    const saved = [];
    for (let i = 0; i < holds.length; i++) {
      saved.push({ id: holds[i].id, name: holds[i].name });
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  } catch (e) {
    // storage not available, holds just won't survive a reload
  }
}

async function loadHolds() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw === null) {
      return;
    }
    const saved = JSON.parse(raw);
    for (let i = 0; i < saved.length; i++) {
      try {
        const order = await request("/orders/" + saved[i].id);
        order.name = saved[i].name;
        order.lastCheck = 0;
        holds.push(order);
      } catch (e) {
        // order no longer exists, skip it
      }
    }
    saveHolds();
  } catch (e) {
    // ignore unreadable storage
  }
}

function stateText(status) {
  if (status === "PENDING") {
    return "Held for you";
  }
  if (status === "PAID") {
    return "Paid";
  }
  if (status === "CANCELLED") {
    return "Cancelled and returned to the shelf";
  }
  return "Time ran out and the items went back on the shelf";
}

function formatTime(ms) {
  const total = Math.ceil(ms / 1000);
  const minutes = Math.floor(total / 60);
  const seconds = total % 60;
  return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
}

function renderHolds() {
  const box = document.getElementById("orders");
  box.innerHTML = "";
  document.getElementById("holdsEmpty").hidden = holds.length > 0;
  for (let i = holds.length - 1; i >= 0; i--) {
    const h = holds[i];
    const card = el("div", "hold " + h.status.toLowerCase());
    card.appendChild(el("p", "hold-title", h.quantity + " x " + h.name));
    card.appendChild(el("p", "hold-id", "Order " + h.id));
    card.appendChild(el("p", "hold-state", stateText(h.status)));

    if (h.status === "PENDING") {
      const meter = el("div", "meter");
      const fill = el("div", "fill");
      meter.appendChild(fill);
      const time = el("p", "time", "");
      h.fillEl = fill;
      h.timeEl = time;

      const actions = el("div", "actions");
      const pay = el("button", "", "Pay");
      pay.onclick = function () {
        changeHold(h, "pay");
      };
      const cancel = el("button", "secondary", "Cancel hold");
      cancel.onclick = function () {
        changeHold(h, "cancel");
      };
      actions.appendChild(pay);
      actions.appendChild(cancel);

      card.appendChild(meter);
      card.appendChild(time);
      card.appendChild(actions);
    }
    box.appendChild(card);
  }
  tick();
}

async function changeHold(hold, action) {
  try {
    const fresh = await request("/orders/" + hold.id + "/" + action, { method: "POST" });
    hold.status = fresh.status;
    renderHolds();
    if (action === "pay") {
      showMessage("Paid. Order " + hold.id + " is confirmed.", false);
    } else {
      showMessage("Hold cancelled. The items are back on the shelf.", false);
    }
    search();
  } catch (e) {
    showMessage(e.message, true);
    syncHold(hold);
  }
}

async function syncHold(hold) {
  try {
    const fresh = await request("/orders/" + hold.id);
    if (fresh.status !== hold.status) {
      hold.status = fresh.status;
      renderHolds();
      search();
    }
  } catch (e) {
    // try again on the next tick
  }
}

function clearFinished() {
  for (let i = holds.length - 1; i >= 0; i--) {
    if (holds[i].status !== "PENDING") {
      holds.splice(i, 1);
    }
  }
  saveHolds();
  renderHolds();
}

function tick() {
  const now = Date.now();
  for (let i = 0; i < holds.length; i++) {
    const h = holds[i];
    if (h.status !== "PENDING" || !h.timeEl) {
      continue;
    }
    const total = new Date(h.expiresAt) - new Date(h.createdAt);
    const left = new Date(h.expiresAt) - now;
    if (left > 0) {
      h.timeEl.textContent = formatTime(left) + " left to pay";
      h.fillEl.style.width = (left / total * 100) + "%";
      if (left < 60000) {
        h.fillEl.classList.add("urgent");
      }
    } else {
      h.fillEl.style.width = "0%";
      h.timeEl.textContent = "Time is up. Checking with the server...";
      if (now - h.lastCheck > 3000) {
        h.lastCheck = now;
        syncHold(h);
      }
    }
  }
}

async function start() {
  await loadHolds();
  renderHolds();
  search();
  setInterval(tick, 1000);
}

start();
</script>
</body>
</html>
